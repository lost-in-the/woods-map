name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Specs (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.0', '3.2', '3.4']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      # The headless render spec draws every generated diagram with the
      # vendored Pele in the runner's Node; a missing Node fails it.
      - run: bundle exec rake spec
        env:
          WOODS_MAP_RENDER_SPEC: '1'
      # The M8 gate on a real socket: the dummy host under Puma, driven over
      # loopback and a non-loopback address of the runner.
      - run: bundle exec rspec spec/woods_map/engine_http_server_spec.rb
        env:
          WOODS_MAP_RUN_HTTP_SERVER: '1'
  browser:
    name: Browser specs (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      # The specs pass no sandbox flag and the runner's user namespaces are
      # restricted, so they get Chrome through a wrapper (see AGENTS.md).
      - name: Chromium wrapper
        run: |
          wrapper="$RUNNER_TEMP/chromium-no-sandbox"
          printf '#!/bin/sh\nexec google-chrome --no-sandbox "$@"\n' > "$wrapper"
          chmod +x "$wrapper"
          echo "WOODS_MAP_BROWSER=$wrapper" >> "$GITHUB_ENV"
      - name: Browser runtime metadata
        continue-on-error: true
        timeout-minutes: 1
        run: |
          mkdir -p tmp/browser-failures
          {
            printf 'wrapper: %s\n' "$WOODS_MAP_BROWSER"
            head -c 2048 "$WOODS_MAP_BROWSER"
            command -v google-chrome
            readlink -f "$(command -v google-chrome)"
            timeout 5s google-chrome --version || true
            ruby --version
            uname -srm
            head -c 2048 /etc/os-release
          } > tmp/browser-failures/runtime.txt 2>&1
      # Every spec file that gates on WOODS_MAP_BROWSER; the Specs jobs skip
      # them, so nothing runs twice and a new browser spec is picked up.
      - run: bundle exec rspec $(grep -rl --include='*_spec.rb' WOODS_MAP_BROWSER spec | sort)
        env:
          WOODS_MAP_RENDER_SPEC: '1'
          WOODS_MAP_BROWSER_ARTIFACTS: tmp/browser-failures
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ github.run_attempt }}
          path: tmp/browser-failures
          if-no-files-found: ignore
          retention-days: 7
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rubocop
