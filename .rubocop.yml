require:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.0
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'spec/dummy/tmp/**/*'
    - 'bin/*'

# The Bundler entry file carries the gem's name.
Naming/FileName:
  Exclude:
    - 'lib/woods-map.rb'

Style/Documentation:
  Exclude:
    - 'spec/**/*'

Metrics/BlockLength:
  Exclude:
    - 'config/routes.rb'
    - 'spec/**/*'
    - '*.gemspec'
    - 'config/routes.rb'

# The same posture as Woods: presenters shape index data into rows and tiles,
# which reads better as one method than as ten.
Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 25

Metrics/ClassLength:
  Max: 140

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 10

# Struct members named after the thing they hold (a filter, a count) read
# better than renamed ones; nothing enumerates these structs.
Lint/StructNewOverride:
  Enabled: false

Rails:
  Enabled: true

Rails/ApplicationController:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 4

RSpec/ExampleLength:
  Max: 12
